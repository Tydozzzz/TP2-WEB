<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TP5 - Exercice 2</title>
    <link rel="stylesheet" href="Style/style.css">
</head>
<body>
    <a href="../index.html">Retour Accueil</a>
    <h1>Tableau des langages de script côté serveur</h1>

    <table>
        <caption>Comparatif des langages serveurs</caption>
        <thead>
            <tr>
                <th>Logo</th>
                <th>Non abrégé</th>
                <th>Nom complet</th>
                <th>Année de sortie</th>
                <th>Site web de référence</th>
                <th>Exemple de code</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <!-- Lien vers l'image en grand + info bulle (title) -->
                <td>
                    <a href="https://www.php.net/images/logos/new-php-logo.png" target="_blank" title="Cliquez pour voir en grand">
                        <img src="https://www.php.net/images/logos/new-php-logo.png" alt="Logo PHP" width="50">
                    </a>
                </td>
                <td>Php</td>
                <td>Hypertext Preprocessor</td>
                <td>1995</td>
                <!-- Lien externe qui s'ouvre dans un nouvel onglet -->
                <td>
                    <a href="https://www.php.net" target="_blank" title="Vers le site officiel de PHP">php.net</a>
                </td>
                <td><code>&lt;?php echo "Hello"; ?&gt;</code></td>
            </tr>
            <!-- Tu pourras ajouter Python, Ruby etc. ici sur le même modèle -->
        </tbody>
    </table>
</body>
</html>
